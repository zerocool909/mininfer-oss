<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MinInfer icon">
<rect width="160" height="160" rx="36" fill="#0f1214"/>
<g transform="translate(26, 26)">
  <!-- Threshold line -->
  <line x1="0" y1="58" x2="108" y2="58" stroke="#5f6670" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>

  <!-- Bar 1: Inadequate model -->
  <rect x="4" y="78" width="18" height="26" rx="4" fill="#f1f2f4" opacity=".22"/>

  <!-- Bar 2: Minimum Sufficient Model -->
  <rect x="29" y="50" width="20" height="54" rx="4" fill="#2bc08f" opacity=".22"/>
  <rect x="30" y="51" width="18" height="53" rx="4" fill="#2bc08f"/>
  <circle cx="39" cy="40" r="4.5" fill="#2bc08f"/>

  <!-- Bar 3: Costlier model -->
  <rect x="56" y="32" width="18" height="72" rx="4" fill="#f1f2f4" opacity=".28"/>

  <!-- Bar 4: Frontier model -->
  <rect x="82" y="10" width="18" height="94" rx="4" fill="#f1f2f4" opacity=".18"/>

  <!-- Baseline -->
  <line x1="0" y1="104" x2="108" y2="104" stroke="#f1f2f4" stroke-width="2" stroke-linecap="round" opacity=".35"/>
</g>
</svg>
