<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160" role="img" aria-labelledby="t d">
<title id="t">min(Infer)</title>
<desc id="d">The Ledger mark with min(Infer) function notation: candidate models sorted by cost with a dashed capability threshold and the minimum sufficient inference choice highlighted.</desc>
<style>
.ink{fill:#14171A}.sink{stroke:#14171A}.mute{fill:#5f6670}.smute{stroke:#9aa2ad}.teal{fill:#1D9E75}.steal{stroke:#1D9E75}
@media (prefers-color-scheme:dark){
  .ink{fill:#f1f2f4}.sink{stroke:#f1f2f4}.mute{fill:#9aa2ad}.smute{stroke:#5f6670}.teal{fill:#2bc08f}.steal{stroke:#2bc08f}
}
</style>
<g transform="translate(24, 26)">
  <!-- Threshold line: quality bar -->
  <line x1="0" y1="58" x2="108" y2="58" class="smute" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>

  <!-- Bar 1: Free / sub-tier model (Under threshold, insufficient) -->
  <rect x="4" y="78" width="18" height="26" rx="4" class="ink" opacity=".22"/>

  <!-- Bar 2: Minimum Sufficient Model (First to clear threshold, highlighted in vibrant brand teal) -->
  <rect x="29" y="50" width="20" height="54" rx="4" class="teal" opacity=".2"/>
  <rect x="30" y="51" width="18" height="53" rx="4" class="teal"/>
  <!-- Focus accent indicator atop winning bar -->
  <circle cx="39" cy="40" r="4.5" class="teal"/>

  <!-- Bar 3: Larger generalist model (Overqualified, more expensive) -->
  <rect x="56" y="32" width="18" height="72" rx="4" class="ink" opacity=".28"/>

  <!-- Bar 4: Giant frontier model (Highest cost overkill) -->
  <rect x="82" y="10" width="18" height="94" rx="4" class="ink" opacity=".18"/>

  <!-- Baseline -->
  <line x1="0" y1="104" x2="108" y2="104" class="sink" stroke-width="2" stroke-linecap="round" opacity=".4"/>
</g>
<!-- Wordmark: min(Infer) function notation -->
<text x="160" y="95" letter-spacing="-1.5">
  <tspan class="teal" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-weight="700" font-size="66">min</tspan>
  <tspan class="mute" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-weight="300" font-size="64" opacity=".5">(</tspan>
  <tspan class="ink" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="600" font-size="68">Infer</tspan>
  <tspan class="mute" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-weight="300" font-size="64" opacity=".5">)</tspan>
</text>
<text x="162" y="126" class="mute" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" letter-spacing="0.4">Minimum sufficient inference.</text>
</svg>
