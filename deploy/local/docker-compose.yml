# ===========================================================================
# LOCAL variant — the whole stack in one container on your machine.
#
#   docker compose -f deploy/local/docker-compose.yml up -d --build
#
# ...or just `docker compose up` from the repo root, which includes this file.
#
# This is the local profile (config/profiles/local.env) with one deliberate
# difference: inside a container the bind address must be 0.0.0.0 for the port
# mapping to reach it. On the host the profile keeps 127.0.0.1, which is the
# safer default when there is no container boundary.
# ===========================================================================
services:
  mininfer:
    build:
      # The image is shared by both variants — the cloud stack runs the same
      # artifact with different environment and orchestration. The build context
      # is the repo root so the Dockerfile's COPY paths resolve.
      context: ../..
      dockerfile: Dockerfile
    # Load the repo-root `.env` however compose is invoked. With
    # `-f deploy/local/docker-compose.yml` the project directory becomes
    # `deploy/local/`, so compose would look for `deploy/local/.env` and silently
    # drop every provider key — the container then routes to nothing, or calls a
    # provider with no Authorization header. `required: false` keeps a bare
    # checkout (no `.env` yet) working.
    env_file:
      # Relative to THIS file, so it resolves the same however compose is
      # invoked (`docker compose up` from the repo root, or
      # `-f deploy/local/docker-compose.yml` from anywhere). `required: false`
      # keeps a bare checkout — which has no `.env` yet — working.
      - path: ../../.env
        required: false
    image: mininfer:latest
    container_name: mininfer-router
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MI_DB=/data/mininfer.db
      - MI_POLICY=/app/config/policy.yaml
      - LOG_LEVEL=info
      # Credentials come from `.env` via `env_file` above, NOT from here.
      # An `environment:` entry takes precedence over `env_file:`, so listing
      # `OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}` here pinned every key to the
      # *empty string* whenever the shell had not exported it — which silently
      # beat the `.env` file, so the container called providers with no
      # Authorization header ("Missing Authentication header").
      #
      # Access control stays OFF here (matching config/profiles/local.env); set
      # MI_API_KEYS / MI_ADMIN_TOKEN in `.env` to turn it on. To run the cloud
      # variant locally, use deploy/cloud/ — not this file.
    volumes:
      - mininfer_data:/data
      # A key saved from the dashboard ("To server") is written to the server's
      # `.env`. Binding the repo's copy means it lands on the host and survives a
      # `docker compose up` recreate, instead of living in the container's writable
      # layer and vanishing with it. `create_host_path: false` is deliberate:
      # Docker's default creates a *directory* when `../../.env` is missing, and a
      # directory where a file is expected breaks the app on import. Run
      # `cp .env.example .env` first — a missing file then fails loudly here.
      - type: bind
        source: ../../.env
        target: /app/.env
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough for the first-run catalogue ingest the entrypoint does on an
      # empty registry; a container that is ingesting is not "unhealthy".
      start_period: 180s

  # =========================================================================
  # The nightly registry refresh — opt-in, via `--profile jobs`:
  #
  #   docker compose --profile jobs up -d
  #
  # Default `docker compose up` is unchanged (one web process), because a laptop
  # does not always want a container that wakes up at night. Without it nothing
  # refreshes the registry: prices and "free" labels are whatever the last
  # manual `mi ingest` saw, which is how a five-day-old catalogue went unnoticed.
  # =========================================================================
  verify:
    profiles: ["jobs"]
    build:
      context: ../..
      dockerfile: Dockerfile
    # Load the repo-root `.env` however compose is invoked. With
    # `-f deploy/local/docker-compose.yml` the project directory becomes
    # `deploy/local/`, so compose would look for `deploy/local/.env` and silently
    # drop every provider key — the container then routes to nothing, or calls a
    # provider with no Authorization header. `required: false` keeps a bare
    # checkout (no `.env` yet) working.
    env_file:
      # Relative to THIS file, so it resolves the same however compose is
      # invoked (`docker compose up` from the repo root, or
      # `-f deploy/local/docker-compose.yml` from anywhere). `required: false`
      # keeps a bare checkout — which has no `.env` yet — working.
      - path: ../../.env
        required: false
    image: mininfer:latest
    container_name: mininfer-verify
    restart: unless-stopped
    command:
      - sh
      - -c
      # One command, not three joined with `||`. `mi refresh` is verify ->
      # reconcile -> metrics in the order that contract requires, so the
      # schedule cannot quietly drift from the pipeline it is supposed to run.
      - >-
        while true; do mi refresh --report /data/verify.json || true; sleep 86400; done
    environment:
      - MI_DB=/data/mininfer.db
      - MI_POLICY=/app/config/policy.yaml
      - LOG_LEVEL=info
      # The provider keys the refresh needs. Without them a source is skipped.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
    volumes:
      # Same volume as the web service: one registry, two processes.
      - mininfer_data:/data
      # Read the same `.env` the web service writes, so a key saved from the
      # dashboard is visible to `mi refresh` on its next iteration (each `mi`
      # invocation is a fresh process and calls `load_env`).
      - type: bind
        source: ../../.env
        target: /app/.env
        bind:
          create_host_path: false

volumes:
  mininfer_data:
    name: mininfer_data
